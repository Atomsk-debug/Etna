org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties - check these on https://fabricmc.net/develop
# Snapshot 3 is the newest one Fabric supports today; any 26.4 snapshot should work
# as long as the rendering classes used by the mixin did not change.
minecraft_version=26.4-snapshot-3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
# Bump on every build handed out for testing: patch for fixes, minor for new features. The jar and the
# version shown in the game's mod list both become <mod_version>+mc<minecraft_version>.
mod_version=0.8.0
group=it.cosimo.etna

# Dependencies
fabric_api_version=0.162.2+26.4
